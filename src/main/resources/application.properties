spring.application.name=CarRentalSystem1


spring.datasource.url=${SPRING_DATASOURCE_URL}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# MySQLDialect is auto-detected, no need to specify explicitly

server.port=${PORT:8080}

spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=always

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:CarRentalSystem2024SecureJWTKeyForRender!!}

# Set FRONTEND_URL env variable in Render dashboard to your Vercel URL
frontend.url=${FRONTEND_URL:http://localhost:5173}
# Frontend URL
# ===============================
# RAZORPAY
# ===============================


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ===============================
# EMAIL SMTP
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# GOOGLE OAUTH
# ===============================


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
