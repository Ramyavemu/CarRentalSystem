spring.application.name=CarRentalSystem1

# Datasource: MySQL if SPRING_DATASOURCE_URL is provided, or H2 in-memory DB by default
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:carrentalsystem;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=always

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:CarRentalSystem2024SecureJWTKeyForRender!!}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# RAZORPAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret}

# ===============================
# EMAIL SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# GOOGLE OAUTH
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy_google_client_secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

